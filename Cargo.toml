[workspace]
members = [
    "dupes-core",
    "dupes-treesitter",
    "dupes-python",
    "dupes-rust",
    "cargo-dupes",
    "code-dupes",
    "dupes-cli-test-support",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/earthlings-dev/cargo-dupes"
authors = ["Matjaz Domen Pecan <matjaz.pecan@gmail.com>", "Takumi Shimada <hello@takumi.earth"]
rust-version = "1.96"
categories = ["development-tools"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow impractical pedantic lints
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
too_long_first_doc_paragraph = "allow"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
implicit_hasher = "allow"
option_if_let_else = "allow"
useless_let_if_seq = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
walkdir = "2"
thiserror = "2"
tempfile = "3"
tree-sitter = "0.26"
tree-sitter-python = "0.25"
blake3 = "1"
globset = "0.4"
ignore = "0.4"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
predicates = "3"
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }

dupes-core = { path = "dupes-core", version = "0.3.0" }
dupes-treesitter = { path = "dupes-treesitter", version = "0.3.0" }
dupes-python = { path = "dupes-python", version = "0.3.0" }
dupes-rust = { path = "dupes-rust", version = "0.3.0" }
